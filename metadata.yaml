name: bili_dynamic_watcher
display_name: B站动态监听
short_desc: 监听B站UP主/微博动态推送QQ群（带图片），转发/抽奖默认忽略，WBI签名+退避+RSS兜底（v2.1）
desc: "监听指定 B 站 UP 主（及微博等 RSS 源）的动态，新动态自动推送到配置的 QQ 群。v2.0 强壮化：官方接口 WBI 签名 + 自动 buvid 指纹 + 风控自适应退避 + RSS 兜底（RSSHub/RSSWorker，支持微博），auto 模式自动切换；推送可附带动态图片（图文/封面/转发原图），转发与抽奖类动态默认不推送（可配置）；纯后台轮询 + 主动推送，不依赖 LLM"
help: "指令：bd列表 / bd添加 <UID> [备注] / bd删除 <UID> / bd状态 / bd测试（需 @ 或唤醒词；管理指令需管理员权限）"
version: 2.1.3
author: siwuli
repo: https://github.com/siwuli/AstrBot_siwu-bili-dynamic-watcher
astrbot_version: ">=4.0.0"